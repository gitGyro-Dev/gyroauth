name: GyroOS Consumption Boundary

on:
  workflow_dispatch:
  push:
    paths:
      - "app/vnext/gyroos_consumption.py"
      - "app/vnext/gyroos_consumption_service.py"
      - "app/vnext/gyroos_http_transport.py"
      - "tests/vnext/test_gyroos_consumption_models.py"
      - "tests/vnext/test_gyroos_consumption_service.py"
      - "tests/vnext/test_gyroos_http_transport.py"
      - ".github/workflows/gyroos-consumption-boundary.yml"
  pull_request:
    paths:
      - "app/vnext/gyroos_consumption.py"
      - "app/vnext/gyroos_consumption_service.py"
      - "app/vnext/gyroos_http_transport.py"
      - "tests/vnext/test_gyroos_consumption_models.py"
      - "tests/vnext/test_gyroos_consumption_service.py"
      - "tests/vnext/test_gyroos_http_transport.py"
      - ".github/workflows/gyroos-consumption-boundary.yml"

permissions:
  contents: read

jobs:
  test-consumption-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install bounded test dependencies
        run: python -m pip install pytest pydantic

      - name: Run GyroOS consumption boundary tests
        run: >-
          python -m pytest
          tests/vnext/test_gyroos_consumption_models.py
          tests/vnext/test_gyroos_consumption_service.py
          tests/vnext/test_gyroos_http_transport.py
          -q
