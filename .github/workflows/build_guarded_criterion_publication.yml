name: Build Guarded Criterion Publication PDFs

on:
  workflow_dispatch:
  push:
    paths:
      - "paper/guarded_criterion_trajectories_submission_en.md"
      - "paper/guarded_criterion_trajectories_submission_jp.md"
      - "paper/jxiv_publication_metadata.yaml"
      - "figures/guarded_criterion_trajectories_mermaid.md"
      - "tools/build_guarded_criterion_publication.py"
      - "tools/build_guarded_criterion_publication_aligned.py"
      - ".github/workflows/build_guarded_criterion_publication.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install publication toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc \
            poppler-utils \
            texlive-luatex \
            texlive-lang-japanese \
            texlive-latex-extra \
            texlive-fonts-extra \
            fonts-noto-cjk \
            fonts-dejavu-core
          python -m pip install --disable-pip-version-check pyyaml
          npm install --global @mermaid-js/mermaid-cli@11.4.2
          mmdc --version

      - name: Configure Mermaid browser for GitHub Actions
        run: |
          cat > /tmp/mermaid-puppeteer-config.json <<'EOF'
          {
            "args": [
              "--no-sandbox",
              "--disable-setuid-sandbox",
              "--disable-dev-shm-usage"
            ]
          }
          EOF
          mkdir -p /tmp/mermaid-bin
          cat > /tmp/mermaid-bin/mmdc <<'EOF'
          #!/usr/bin/env bash
          exec /usr/local/bin/mmdc "$@" -p /tmp/mermaid-puppeteer-config.json
          EOF
          chmod +x /tmp/mermaid-bin/mmdc
          echo "/tmp/mermaid-bin" >> "$GITHUB_PATH"

      - name: Build canonically numbered figures and publication PDFs
        env:
          AUTHOR_EMAIL: ${{ secrets.JXIV_CORRESPONDING_EMAIL }}
        run: |
          if [ -n "$AUTHOR_EMAIL" ]; then
            python tools/build_guarded_criterion_publication_aligned.py --strict
          else
            echo "JXIV_CORRESPONDING_EMAIL is not configured; using the confirmed repository metadata value."
            python tools/build_guarded_criterion_publication_aligned.py --strict
          fi

      - name: Inspect rendered figures
        run: |
          test "$(find dist/figures -maxdepth 1 -type f -name 'figure_*.svg' | wc -l)" -eq 6
          test "$(find dist/figures -maxdepth 1 -type f -name 'figure_*.png' | wc -l)" -eq 6
          test "$(find dist/figures -maxdepth 1 -type f -name 'figure_*.pdf' | wc -l)" -eq 6
          for number in 1 2 3 4 5 6; do
            test -s "dist/figures/figure_${number}.svg"
            test -s "dist/figures/figure_${number}.png"
            test -s "dist/figures/figure_${number}.pdf"
          done
          find dist/figures -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Inspect PDF metadata, images, and text extraction
        run: |
          set -euo pipefail

          EN_PDF=dist/guarded_criterion_trajectories_en.pdf
          JP_PDF=dist/guarded_criterion_trajectories_jp.pdf

          pdfinfo "$EN_PDF" | tee /tmp/en_pdfinfo.txt
          pdfinfo "$JP_PDF" | tee /tmp/jp_pdfinfo.txt
          pdftotext -layout "$EN_PDF" /tmp/en_text.txt
          pdftotext -layout "$JP_PDF" /tmp/jp_text.txt
          pdfimages -list "$EN_PDF" | tee /tmp/en_images.txt
          pdfimages -list "$JP_PDF" | tee /tmp/jp_images.txt

          python - <<'PY'
          from pathlib import Path
          import re

          limit = 20 * 1024 * 1024
          email = "dev.jxiv@gyro-wedge.com"
          checks = {
              "en": {
                  "pdf": Path("dist/guarded_criterion_trajectories_en.pdf"),
                  "info": Path("/tmp/en_pdfinfo.txt"),
                  "text": Path("/tmp/en_text.txt"),
                  "images": Path("/tmp/en_images.txt"),
                  "title": "Guarded Criterion Trajectories",
              },
              "jp": {
                  "pdf": Path("dist/guarded_criterion_trajectories_jp.pdf"),
                  "info": Path("/tmp/jp_pdfinfo.txt"),
                  "text": Path("/tmp/jp_text.txt"),
                  "images": Path("/tmp/jp_images.txt"),
                  "title": "適応型認証",
              },
          }

          for lang, item in checks.items():
              info = item["info"].read_text(encoding="utf-8", errors="replace")
              text = item["text"].read_text(encoding="utf-8", errors="replace")
              compact = re.sub(r"\s+", " ", text)
              image_lines = [
                  line for line in item["images"].read_text(encoding="utf-8", errors="replace").splitlines()
                  if re.match(r"^\s*\d+\s+\d+\s+", line)
              ]

              assert "Page size:" in info and "A4" in info, f"{lang}: PDF is not A4"
              assert item["pdf"].stat().st_size < limit, f"{lang}: PDF exceeds 20 MiB"
              assert len(image_lines) >= 6, f"{lang}: expected at least 6 embedded images, found {len(image_lines)}"
              assert item["title"] in compact, f"{lang}: title text was not extracted"
              assert email in compact, f"{lang}: corresponding email was not extracted"
              print(
                  f"{lang}: PASS; size={item['pdf'].stat().st_size}; "
                  f"images={len(image_lines)}; title=yes; email=yes"
              )
          PY

      - name: Commit publication PDFs
        run: |
          set -euo pipefail
          target_dir="publications/guarded_criterion_trajectories/jxiv_submission"
          mkdir -p "$target_dir"
          cp dist/guarded_criterion_trajectories_en.pdf "$target_dir/guarded_criterion_trajectories_en.pdf"
          cp dist/guarded_criterion_trajectories_jp.pdf "$target_dir/guarded_criterion_trajectories_jp.pdf"

          if git diff --quiet -- "$target_dir"; then
            echo "Publication PDFs are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target_dir"
          git commit -m "Add final guarded criterion publication PDFs"
          git push origin HEAD:main

      - name: Upload publication package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: guarded-criterion-publication-package
          path: |
            dist/guarded_criterion_trajectories_en.pdf
            dist/guarded_criterion_trajectories_jp.pdf
            dist/figures/figure_*.svg
            dist/figures/figure_*.png
            dist/figures/figure_*.pdf
          if-no-files-found: error
          retention-days: 30