name: Build Guarded Criterion Publication PDFs

on:
  workflow_dispatch:
  push:
    paths:
      - "paper/guarded_criterion_trajectories_submission_en.md"
      - "paper/guarded_criterion_trajectories_submission_jp.md"
      - "paper/jxiv_publication_metadata.yaml"
      - "figures/guarded_criterion_trajectories_mermaid.md"
      - "tools/build_guarded_criterion_publication.py"
      - "tools/build_guarded_criterion_publication_aligned.py"
      - ".github/workflows/build_guarded_criterion_publication.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install publication toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc \
            poppler-utils \
            texlive-luatex \
            texlive-lang-japanese \
            texlive-latex-extra \
            texlive-fonts-extra \
            fonts-noto-cjk \
            fonts-dejavu-core
          python -m pip install --disable-pip-version-check pyyaml
          npm install --global @mermaid-js/mermaid-cli@11.4.2
          mmdc --version

      - name: Configure Mermaid browser for GitHub Actions
        run: |
          cat > /tmp/mermaid-puppeteer-config.json <<'EOF'
          {
            "args": [
              "--no-sandbox",
              "--disable-setuid-sandbox",
              "--disable-dev-shm-usage"
            ]
          }
          EOF
          mkdir -p /tmp/mermaid-bin
          cat > /tmp/mermaid-bin/mmdc <<'EOF'
          #!/usr/bin/env bash
          exec /usr/local/bin/mmdc "$@" -p /tmp/mermaid-puppeteer-config.json
          EOF
          chmod +x /tmp/mermaid-bin/mmdc
          echo "/tmp/mermaid-bin" >> "$GITHUB_PATH"

      - name: Build canonically numbered figures and publication PDFs
        env:
          AUTHOR_EMAIL: ${{ secrets.JXIV_CORRESPONDING_EMAIL }}
        run: |
          if [ -n "$AUTHOR_EMAIL" ]; then
            python tools/build_guarded_criterion_publication_aligned.py --strict
          else
            echo "JXIV_CORRESPONDING_EMAIL is not configured; using the confirmed repository metadata value."
            python tools/build_guarded_criterion_publication_aligned.py --strict
          fi

      - name: Inspect rendered figures
        run: |
          test "$(find dist/figures -maxdepth 1 -type f -name 'figure_*.svg' | wc -l)" -eq 6
          test "$(find dist/figures -maxdepth 1 -type f -name 'figure_*.png' | wc -l)" -eq 6
          test "$(find dist/figures -maxdepth 1 -type f -name 'figure_*.pdf' | wc -l)" -eq 6
          for number in 1 2 3 4 5 6; do
            test -s "dist/figures/figure_${number}.svg"
            test -s "dist/figures/figure_${number}.png"
            test -s "dist/figures/figure_${number}.pdf"
          done
          find dist/figures -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Inspect PDF metadata, images, and text extraction
        run: |
          pdfinfo dist/guarded_criterion_trajectories_en.pdf | tee /tmp/en_pdfinfo.txt
          pdfinfo dist/guarded_criterion_trajectories_jp.pdf | tee /tmp/jp_pdfinfo.txt
          grep -qE '^Page size:.*A4' /tmp/en_pdfinfo.txt
          grep -qE '^Page size:.*A4' /tmp/jp_pdfinfo.txt
          test "$(stat -c%s dist/guarded_criterion_trajectories_en.pdf)" -lt 20971520
          test "$(stat -c%s dist/guarded_criterion_trajectories_jp.pdf)" -lt 20971520
          test "$(pdfimages -list dist/guarded_criterion_trajectories_en.pdf | tail -n +3 | wc -l)" -ge 6
          test "$(pdfimages -list dist/guarded_criterion_trajectories_jp.pdf | tail -n +3 | wc -l)" -ge 6
          pdftotext dist/guarded_criterion_trajectories_en.pdf - | grep -q "Guarded Criterion Trajectories"
          pdftotext dist/guarded_criterion_trajectories_en.pdf - | grep -q "dev.jxiv@gyro-wedge.com"
          pdftotext dist/guarded_criterion_trajectories_jp.pdf - | grep -q "適応型認証"
          pdftotext dist/guarded_criterion_trajectories_jp.pdf - | grep -q "dev.jxiv@gyro-wedge.com"

      - name: Upload publication package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: guarded-criterion-publication-package
          path: |
            dist/guarded_criterion_trajectories_en.pdf
            dist/guarded_criterion_trajectories_jp.pdf
            dist/figures/figure_*.svg
            dist/figures/figure_*.png
            dist/figures/figure_*.pdf
          if-no-files-found: error
          retention-days: 30
